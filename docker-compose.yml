services:
  ampere:
    image: ${DOCKER_REGISTRY-}ampere
    build:
      context: .
      dockerfile: src/web/Ampere/Dockerfile
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 80
      ASPNETCORE_HTTPS_PORT: 443
      ASPNETCORE_URLS: "https://+:443;http://+:80"
      ASPNETCORE_Kestrel__Endpoints__Https__Url: "https://*:443"
      ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path: /app/certs/ayllu.pfx
      ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password: ${HTTPS_CERT_PASSWORD} 
      ConnectionStrings__Ampere: Server=sqlserver;Database=${APP_DB_NAME};User Id=${APP_DB_USER};Password=${APP_DB_PASSWORD};TrustServerCertificate=True;
      Jwt__Key: ${JWT_KEY}
    networks:
      - ampere  
    ports:
      - "10080:80"
      - "10443:443"
    volumes:
      - ./certs/ampere.pfx:/app/certs/ampere.pfx:ro
      - ./certs/ampere.crt:/usr/local/share/ca-certificates/ampere.crt:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd"
        if [ ! -f "$$SQLCMD" ]; then
            SQLCMD="/opt/mssql-tools/bin/sqlcmd"
        fi
        echo "🚀 Starting SQL Server in background..."
        /opt/mssql/bin/sqlservr &
        PID=$$!
        echo "🔄 Waiting for SQL Server..."
        until $$SQLCMD -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do
          sleep 2
        done
        echo "🎲 Creating database..."
        $$SQLCMD -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "
        IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$$APP_DB_NAME')
        BEGIN
            CREATE DATABASE [$$APP_DB_NAME];
        END
        "
        echo "🗝️ Creating login.."
        $$SQLCMD -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "
        IF NOT EXISTS (SELECT name FROM sys.server_principals WHERE name = N'$$APP_DB_USER')
        BEGIN
            CREATE LOGIN [$$APP_DB_USER] WITH PASSWORD = N'$$APP_DB_PASSWORD', CHECK_POLICY = OFF;
        END
        "
        echo "🙋🏻 Creating user.."
        $$SQLCMD -S localhost -U sa -P "$$SA_PASSWORD" -d "$$APP_DB_NAME" -C -Q "
        IF NOT EXISTS (SELECT name FROM sys.database_principals WHERE name = N'$$APP_DB_USER')
        BEGIN
            CREATE USER [$$APP_DB_USER] FOR LOGIN [$$APP_DB_USER];
        END
        IF NOT EXISTS (
            SELECT dp.name
            FROM sys.database_principals dp
            JOIN sys.database_role_members drm ON dp.principal_id = drm.member_principal_id
            JOIN sys.database_principals roles ON drm.role_principal_id = roles.principal_id
            WHERE dp.name = N'$$APP_DB_USER' AND roles.name = 'db_owner'
        )
        BEGIN
            EXEC sp_addrolemember N'db_owner', N'$$APP_DB_USER';
        END
        "
        echo "✅ Done provisioning!"
        wait $$PID
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\" || $$SQLCMD -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ampere
    ports:
      - "11433:1433"
    volumes:
      - sqlserver:/var/opt/mssql  

networks:
  ampere:
    driver: bridge

volumes:
  sqlserver:
    driver: local